name: CI

# Runs on every PR and every push to main. This is the merge-blocking gate —
# pre-commit hooks alone are not enough since they can be bypassed with --no-verify.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/health_dashboard' }}
  JWT_SECRET: super-secret-jwt-key-min-32-chars-length
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  CRON_SECRET: real-cron-secret-min-16-chars-long
  GOOGLE_CLIENT_ID: mock-google-client-id
  GOOGLE_CLIENT_SECRET: mock-google-client-secret
  GOOGLE_REDIRECT_URI: http://localhost:3000/api/connect/google/callback
  APP_BASE_URL: http://localhost:3000

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          NODE_ENV: test
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        env:
          NODE_ENV: test
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Branch protection should require this single check, so adding new jobs above
  # doesn't require reconfiguring required-status-checks every time.
  ci-gate:
    name: CI Gate (required check)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
