name: Scheduled Health Sync Trigger

on:
  schedule:
    # Run hourly at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trigger-sync:
    name: Trigger State-Driven Scheduled Sync
    runs-on: ubuntu-latest
    steps:
      - name: Send Authenticated Scheduled Sync Request
        run: |
          if [ -z "${{ secrets.APP_BASE_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Skipping scheduled sync trigger: APP_BASE_URL or CRON_SECRET secret is not configured yet."
            exit 0
          fi
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.APP_BASE_URL }}/api/sync/scheduled" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Scheduled sync completed successfully."
            exit 0
          else
            echo "Scheduled sync failed with HTTP $HTTP_STATUS"
            exit 1
          fi
