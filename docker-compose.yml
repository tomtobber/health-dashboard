services:
  postgres:
    image: postgres:16-alpine
    container_name: health_dashboard_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
